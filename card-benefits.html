<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>カード特典サーチ</title>
<style>
:root{
  --bg:#f5f6f8; --card:#fff; --text:#1c2230; --sub:#667085; --line:#e3e6ec;
  --accent:#2563eb; --best:#16a34a; --best-bg:#ecfdf3; --warn:#b45309; --warn-bg:#fef3c7; --chip:#eef1f6; --today:#dc2626;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#0f1218; --card:#181c25; --text:#e8ebf2; --sub:#9aa3b5; --line:#2a3040;
    --accent:#6b9bff; --best:#4ade80; --best-bg:#12281b; --warn:#fbbf24; --warn-bg:#33270a; --chip:#232938; --today:#f87171; }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.6 -apple-system,"Hiragino Sans","Noto Sans JP",sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:8px 0 4px}
.sub{font-size:12px;color:var(--sub);margin:0 0 8px}
.search{position:sticky;top:0;background:var(--bg);padding:8px 0 10px;z-index:5}
input[type=search],input[type=text],input[type=number],select{
  width:100%;padding:13px 14px;font-size:16px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--text)}
input:focus,select:focus{outline:2px solid var(--accent);border-color:transparent}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.chip{border:0;background:var(--chip);color:var(--text);padding:9px 14px;border-radius:999px;font-size:14px;cursor:pointer}
.chip:hover{background:var(--line)}
h3.sec{font-size:13px;color:var(--sub);margin:14px 0 2px;font-weight:600}
.store{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:12px 0}
.store h2{font-size:17px;margin:0 0 2px}
.cat{font-size:12px;color:var(--sub)}
.offer{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.rate{min-width:72px;text-align:center;font-weight:700;font-size:20px;line-height:1.2;padding:6px 0;border-radius:10px;background:var(--chip)}
.rate small{display:block;font-size:10px;font-weight:500;color:var(--sub)}
.offer.best .rate{background:var(--best-bg);color:var(--best)}
.offer.today .rate{outline:2px solid var(--today)}
.cname{font-weight:600}
.badge{font-size:11px;padding:1px 7px;border-radius:6px;margin-left:6px;font-weight:600;vertical-align:1px;white-space:nowrap}
.b-best{background:var(--best);color:#fff}
.b-chk{background:var(--warn-bg);color:var(--warn)}
.b-my{background:var(--accent);color:#fff}
.b-today{background:var(--today);color:#fff}
.label{font-size:14px}
.two{font-size:13px;color:var(--text)}
.note{font-size:12px;color:var(--sub)}
.pay{display:inline-block;font-size:12px;background:var(--chip);border-radius:6px;padding:1px 8px;margin-top:2px}
details{margin-top:8px}
summary{cursor:pointer;color:var(--accent);font-size:13px;padding:4px 0}
.base-list{font-size:13px;color:var(--sub);padding:6px 0 0 0;margin:0;list-style:none}
.base-list li{display:flex;justify-content:space-between;gap:8px;border-top:1px dashed var(--line);padding:3px 0}
.empty{color:var(--sub);text-align:center;padding:24px 0}
.tabs{display:flex;gap:6px;margin:6px 0}
.tab{flex:1;padding:11px 4px;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:10px;cursor:pointer;font-size:14px}
.tab[aria-selected=true]{background:var(--accent);border-color:var(--accent);color:#fff}
.box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin:10px 0}
.box h3{margin:0;font-size:15px}
.box p{margin:4px 0 0;font-size:13px;color:var(--sub)}
.box a{color:var(--accent);font-size:12px}
.form{display:grid;gap:8px;margin-top:8px}
.form .row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
button.primary{background:var(--accent);color:#fff;border:0;border-radius:10px;padding:13px;font-size:15px;cursor:pointer}
.my-item{display:flex;justify-content:space-between;gap:8px;font-size:13px;border-top:1px solid var(--line);padding:8px 0}
.my-item button{border:0;background:none;color:#dc2626;cursor:pointer;font-size:14px}
.foot{font-size:12px;color:var(--sub);margin:24px 0}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <h1>💳 カード特典サーチ</h1>
  <p class="sub" id="today"></p>

  <div class="search">
    <input id="q" type="search" placeholder="店舗名・カテゴリ（例: セブン、マック、イオン、ENEOS）" autocomplete="off">
  </div>

  <div class="tabs" role="tablist">
    <button class="tab" role="tab" aria-selected="true" data-tab="search">店舗検索</button>
    <button class="tab" role="tab" aria-selected="false" data-tab="cards">カード/支払方法</button>
    <button class="tab" role="tab" aria-selected="false" data-tab="mine">特典を追加</button>
  </div>

  <section id="p-search">
    <div id="todayBox"></div>
    <div id="histWrap" hidden><h3 class="sec">最近の検索</h3><div class="chips" id="hist"></div></div>
    <h3 class="sec" id="chipsTitle">カテゴリ・店舗</h3>
    <div class="chips" id="chips"></div>
    <div id="results"></div>
  </section>

  <section id="p-cards" hidden></section>

  <section id="p-mine" hidden>
    <p class="note">自分で調べた特典を登録できます（このブラウザ内に保存）。検索結果に「マイ登録」として反映されます。</p>
    <form class="form" id="form">
      <input id="f-store" type="text" placeholder="店舗名（例: ユニクロ）" required>
      <div class="row">
        <select id="f-card"></select>
        <select id="f-type">
          <option value="pt">ポイント還元</option>
          <option value="off">割引（%OFF）</option>
          <option value="perk">その他の特典</option>
        </select>
      </div>
      <div class="row">
        <input id="f-base" type="number" step="0.1" min="0" placeholder="通常 %（任意）">
        <input id="f-max" type="number" step="0.1" min="0" placeholder="最大 %（任意）">
      </div>
      <input id="f-label" type="text" placeholder="特典内容" required>
      <input id="f-note" type="text" placeholder="条件・メモ（任意）">
      <button class="primary" type="submit">登録</button>
    </form>
    <h3 class="sec">登録済み</h3>
    <div id="my-list"></div>
  </section>

  <p class="foot">
    ⚠ 2026年10月にWeb検索（公式サイト・解説記事）で調べた内容を反映した目安です。キャンペーン・還元率・対象店舗・条件
    （タッチ決済、エントリー、上限、会員ランク等）は頻繁に変わります。<span class="badge b-chk">要確認</span> が付く項目は、
    情報源が解説記事のみ、または条件が複雑なものです。必ず公式サイト/アプリでご確認ください。
  </p>
</div>

/* ===== ユーティリティ ===== */
const LS_KEY="card-benefit-custom-v2", HIST_KEY="card-benefit-hist-v1";
const store={
  get(k){try{return JSON.parse(localStorage.getItem(k))||[]}catch(e){return []}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
};
const norm=s=>(s||"").toLowerCase()
  .replace(/[ァ-ヶ]/g,c=>String.fromCharCode(c.charCodeAt(0)-0x60))
  .replace(/[\s\-ー・!！_]/g,"");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=n=>Number.isInteger(n)?n:n.toFixed(1);
const $=id=>document.getElementById(id);
const NOW=new Date(), DOW="日月火水木金土";
const matchToday=d=>d?((d.dom&&d.dom.includes(NOW.getDate()))||(d.dow&&d.dow.includes(NOW.getDay()))):null;

/* 実効率: 日付限定特典は該当日以外は通常値で評価 */
const effRate=x=>{
  const dated=x.days&&!matchToday(x.days);
  const v=dated?x.base:(x.max??x.base);
  return v==null?-1:v;
};

function buildStores(){
  const stores=OFFERS.map(s=>({...s,offers:s.offers.map(x=>({...x}))}));
  store.get(LS_KEY).forEach((m,i)=>{
    const key=norm(m.store);
    let st=stores.find(s=>norm(s.name)===key||s.alias.some(a=>norm(a)===key));
    if(!st){st={name:m.store,alias:[],cat:"マイ登録",offers:[]};stores.push(st)}
    st.offers.push({card:m.card,base:m.base,max:m.max,label:m.label,cond:m.note,type:m.type,my:true});
  });
  return stores;
}

/* ===== 描画 ===== */
function rateBox(x){
  const unit=x.type==="off"?"OFF":"還元";
  const top=x.max??x.base;
  if(top==null) return `<div class="rate">🎁<small>特典</small></div>`;
  return `<div class="rate">${fmt(top)}%<small>${x.max!=null&&x.base!=null&&x.max!==x.base?"最大":unit}</small></div>`;
}
function renderOffer(x,best){
  const c=CARDS[x.card]||{name:x.card};
  const isToday=x.days&&matchToday(x.days);
  const two=(x.base!=null&&x.max!=null&&x.base!==x.max)
    ?`<div class="two">通常 ${fmt(x.base)}% ／ 最大 ${fmt(x.max)}%</div>`:"";
  return `<div class="offer ${best?"best":""} ${isToday?"today":""}">
    ${rateBox(x)}
    <div>
      <div class="cname">${esc(c.name)}
        ${best?'<span class="badge b-best">最高</span>':""}
        ${isToday?'<span class="badge b-today">今日使える</span>':""}
        ${x.days&&!isToday?`<span class="badge b-chk">${esc(x.days.label)}</span>`:""}
        ${x.check?'<span class="badge b-chk">要確認</span>':""}
        ${x.my?'<span class="badge b-my">マイ登録</span>':""}</div>
      <div class="label">${esc(x.label)}</div>
      ${two}
      ${x.pay?`<div><span class="pay">支払: ${esc(x.pay)}</span></div>`:""}
      ${x.cond?`<div class="note">${esc(x.cond)}</div>`:""}
    </div></div>`;
}
function renderStore(s){
  const sorted=[...s.offers].sort((a,b)=>effRate(b)-effRate(a));
  const top=effRate(sorted[0]);
  const used=new Set(s.offers.map(x=>x.card));
  const others=Object.entries(CARDS).filter(([id,c])=>!used.has(id)&&c.base!=null)
    .sort((a,b)=>b[1].base-a[1].base);
  const body=sorted.map(x=>renderOffer(x,top>0&&effRate(x)===top)).join("");
  const baseHtml=others.length?`<details><summary>特典なし：基本還元のみのカード（${others.length}枚）</summary>
    <ul class="base-list">${others.map(([id,c])=>`<li><span>${esc(c.name)}</span><span>${fmt(c.base)}%（${esc(c.baseNote)}）</span></li>`).join("")}</ul></details>`:"";
  return `<article class="store"><h2>${esc(s.name)}</h2><div class="cat">${esc(s.cat)}</div>${body}${baseHtml}</article>`;
}
function render(){
  const q=$("q").value.trim(), box=$("results");
  const showHome=!q;
  $("todayBox").hidden=$("chips").hidden=$("chipsTitle").hidden=!showHome;
  $("histWrap").hidden=!showHome||!store.get(HIST_KEY).length;
  if(showHome){box.innerHTML="";return}
  const k=norm(q);
  const hits=buildStores().filter(s=>[s.name,s.cat,...s.alias].some(t=>norm(t).includes(k)));
  if(!hits.length){
    const base=Object.values(CARDS).filter(c=>c.base!=null).sort((a,b)=>b.base-a.base);
    box.innerHTML=`<div class="empty">「${esc(q)}」の特典は登録されていません。</div>
      <article class="store"><h2>基本還元率ランキング</h2><div class="cat">店舗特典がない場合の目安</div>
      <ul class="base-list">${base.map(c=>`<li><span>${esc(c.name)}</span><span>${fmt(c.base)}%（${esc(c.baseNote)}）</span></li>`).join("")}</ul>
      <p class="note">「特典を追加」タブから登録できます。</p></article>`;
    return;
  }
  box.innerHTML=hits.map(renderStore).join("");
}
function renderToday(){
  const items=[];
  buildStores().forEach(s=>s.offers.forEach(x=>{if(x.days&&matchToday(x.days)) items.push({s,x})}));
  $("today").textContent=`今日は ${NOW.getMonth()+1}/${NOW.getDate()}（${DOW[NOW.getDay()]}）`;
  $("todayBox").innerHTML=items.length
    ?`<div class="store"><h2>📅 今日使える日付限定特典</h2>${items.map(({s,x})=>
       `<div class="offer today">${rateBox(x)}<div><div class="cname">${esc(s.name)} × ${esc(CARDS[x.card]?.name||x.card)}</div>
        <div class="label">${esc(x.label)}</div>${x.cond?`<div class="note">${esc(x.cond)}</div>`:""}</div></div>`).join("")}</div>`
    :`<div class="note">今日が対象の日付限定特典はありません。</div>`;
}
function renderChips(){
  const stores=buildStores();
  const cats=[...new Set(stores.map(s=>s.cat))];
  $("chips").innerHTML=[...cats,...stores.map(s=>s.name)]
    .map(t=>`<button class="chip" data-q="${esc(t)}">${esc(t)}</button>`).join("");
  $("hist").innerHTML=store.get(HIST_KEY).map(t=>`<button class="chip" data-q="${esc(t)}">🕘 ${esc(t)}</button>`).join("");
}
function renderCards(){
  $("p-cards").innerHTML=
   `<h3 class="sec">支払方法の組合せ</h3>`+COMBOS.map(c=>`<div class="box"><h3>${esc(c.name)}</h3><p><b>${esc(c.rate)}</b> ／ ${esc(c.note)}</p></div>`).join("")+
   `<h3 class="sec">カード一覧（${Object.keys(CARDS).length}枚）</h3>`+
   Object.values(CARDS).map(c=>`<div class="box"><h3>${esc(c.name)}</h3>
    <p>基本還元: ${c.base!=null?fmt(c.base)+"%（"+esc(c.baseNote)+"）":esc(c.baseNote)}</p><p>${esc(c.desc)}</p>
    ${c.src?`<a href="${esc(c.src)}" target="_blank" rel="noopener">参考ページ</a>`:""}</div>`).join("");
}
function renderMy(){
  const my=store.get(LS_KEY);
  $("my-list").innerHTML=my.length?my.map((m,i)=>`<div class="my-item"><span><b>${esc(m.store)}</b> / ${esc(CARDS[m.card]?.name||m.card)} /
    ${m.max!=null?"最大"+fmt(m.max)+"% ":""}${esc(m.label)}</span><button data-del="${i}">削除</button></div>`).join("")
    :'<div class="note">まだありません。</div>';
}
function pushHist(q){
  if(!q) return;
  const h=[q,...store.get(HIST_KEY).filter(x=>x!==q)].slice(0,8);
  store.set(HIST_KEY,h);
}

/* ===== イベント ===== */
$("q").addEventListener("input",render);
$("q").addEventListener("change",()=>{pushHist($("q").value.trim());renderChips()});
document.addEventListener("click",e=>{
  const b=e.target.closest(".chip"); if(!b) return;
  $("q").value=b.dataset.q; pushHist(b.dataset.q); renderChips(); render();
  window.scrollTo({top:0,behavior:"smooth"});
});
document.querySelectorAll(".tab").forEach(t=>t.addEventListener("click",()=>{
  document.querySelectorAll(".tab").forEach(x=>x.setAttribute("aria-selected",x===t));
  ["search","cards","mine"].forEach(n=>$("p-"+n).hidden=n!==t.dataset.tab);
}));
$("f-card").innerHTML=Object.entries(CARDS).map(([id,c])=>`<option value="${id}">${esc(c.name)}</option>`).join("");
$("form").addEventListener("submit",e=>{
  e.preventDefault();
  const n=id=>$(id).value===""?null:parseFloat($(id).value);
  const my=store.get(LS_KEY);
  my.push({store:$("f-store").value.trim(),card:$("f-card").value,type:$("f-type").value,
    base:n("f-base"),max:n("f-max"),label:$("f-label").value.trim(),note:$("f-note").value.trim()});
  store.set(LS_KEY,my); e.target.reset(); renderMy(); renderChips(); renderToday(); render();
});
$("my-list").addEventListener("click",e=>{
  const i=e.target.dataset.del; if(i==null) return;
  const my=store.get(LS_KEY); my.splice(+i,1); store.set(LS_KEY,my); renderMy(); renderChips(); render();
});

renderToday(); renderChips(); renderCards(); renderMy(); render();
</script>
